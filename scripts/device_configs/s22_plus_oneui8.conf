# Samsung Galaxy S22 Plus OneUI 8 GSI Configuration
# This configuration file defines device-specific settings for S22 Plus with OneUI 8 GSI

# Device identification
DEVICE_MODELS="SM-S906B SM-S906E SM-S906N SM-S906U SM-S906W"
DEVICE_CODENAME="s22plus"
ONEUI_VERSION_MIN="8.0"

# Chipset configurations
EXYNOS2200_BOARD_NAMES="s5e9925 exynos2200"
SM8450_BOARD_NAMES="sm8450 taro"

# Patch configurations
ENABLE_ENHANCED_RKP_BYPASS=true
ENABLE_ENHANCED_DEFEX_BYPASS=true
ENABLE_ENHANCED_PROCA_BYPASS=true
ENABLE_GSI_VENDOR_FIX=true
ENABLE_KNOX_GSI_BYPASS=true
ENABLE_EXYNOS2200_PATCHES=true
ENABLE_SM8450_PATCHES=true
ENABLE_GSI_PROPERTY_BYPASS=true
ENABLE_GSI_SELINUX_BYPASS=true

# GSI specific settings
GSI_VENDOR_MOUNT_POINT="/vendor"
GSI_SYSTEM_MOUNT_POINT="/system"
GSI_PRODUCT_MOUNT_POINT="/product"

# Security bypass settings
RKP_BYPASS_LEVEL="enhanced"
DEFEX_BYPASS_LEVEL="enhanced"
PROCA_BYPASS_LEVEL="enhanced"
KNOX_BYPASS_LEVEL="gsi_compatible"

# Hardware specific settings
CAMERA_HAL_BYPASS=true
AUDIO_HAL_BYPASS=true
DISPLAY_HAL_BYPASS=true
FINGERPRINT_HAL_BYPASS=true

# Boot image settings
KEEP_VERITY=false
KEEP_FORCE_ENCRYPT=false
PATCH_VBMETA_FLAG=true
RECOVERY_MODE=false
LEGACY_SAR=false

# Logging and debugging
ENABLE_DEBUG_LOGGING=true
ENABLE_PATCH_LOGGING=true

# Compatibility flags
TREBLE_ENABLED=true
VNDK_VERSION="30"
VENDOR_API_LEVEL="30"

# Known issues and workarounds
CAMERA_WORKAROUND_ENABLED=true
AUDIO_WORKAROUND_ENABLED=true
FINGERPRINT_WORKAROUND_ENABLED=true

# Notes:
# - This configuration is specifically for Samsung Galaxy S22 Plus with OneUI 8 GSI
# - Patches are applied conditionally based on device detection
# - Some patches may cause bootloops if applied incorrectly
# - Testing on actual hardware is recommended before deployment

